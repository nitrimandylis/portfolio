<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mockup a: the desk</title>
<style>
/* A. the desk: polaroids dropped on a charcoal table, an index card holds the words */
@font-face{font-family:Chillax;src:url(/fonts/Chillax-Variable.woff2) format("woff2");font-weight:200 700}
:root{--table:#141312;--paper:#ece6da;--card:#f3efe6;--ink:#221c16;--mu:#7d7468;--rule:#b9c6d3;--red:#c9705f;--ac:#e0a35a}
*{box-sizing:border-box}
html{background:var(--table);color:var(--paper);font:400 17px/1.5 Chillax,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{margin:0;min-height:100vh;overflow:hidden;
  background:radial-gradient(ellipse at 45% 40%,#1d1b18 0,var(--table) 70%)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:4px}
.hw{display:block;background:currentColor;-webkit-mask:var(--src) left center/contain no-repeat;mask:var(--src) left center/contain no-repeat}

.desk{position:relative;width:100vw;height:100vh;margin:0;padding:0;list-style:none}
.desk>*{position:absolute;left:var(--x);top:var(--y);transform:rotate(var(--r));transition:transform .25s cubic-bezier(.2,.8,.3,1.2)}
.desk>li:hover,.desk>li:focus-within{z-index:5;transform:rotate(calc(var(--r) * .4)) translateY(-6px) scale(1.03)}

.pol{display:block;width:var(--w);aspect-ratio:88/107;padding:calc(var(--w)*6/88) calc(var(--w)*4.5/88) 0;background:var(--paper);color:var(--ink);
  box-shadow:0 1px 1px rgba(0,0,0,.4),0 14px 30px -10px rgba(0,0,0,.7)}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;filter:contrast(1.04) saturate(.85) sepia(.08)}
.pol .hw{height:calc(var(--w)*13/88);margin:calc(var(--w)*4/88) 0 0 2px;width:100%}

/* the index card: name, line, song, contact */
.card{width:min(30vw,420px);aspect-ratio:5/3;background:var(--card);color:var(--ink);padding:0 26px;
  background-image:linear-gradient(var(--red),var(--red)),repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px);
  background-size:100% 1px,100% 100%;background-position:0 56px,0 57px;background-repeat:no-repeat,repeat-y;
  box-shadow:0 1px 1px rgba(0,0,0,.4),0 14px 30px -10px rgba(0,0,0,.7);display:flex;flex-direction:column}
.card .hw{height:46px;width:200px;margin:8px 0 9px}
.card p{margin:0;font-size:15px;line-height:28px}
.card .now{color:var(--mu)}
.card .now b{color:var(--ink);font-weight:500}
.card nav{margin-top:auto;padding-bottom:10px;display:flex;gap:18px;font-size:15px}
.card nav a{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}

@media (max-width:760px){
  body{overflow:auto}
  .desk{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:28px 16px;padding:28px 18px 60px}
  .desk>*{position:static}
  .card{grid-column:1/-1;width:100%;aspect-ratio:auto;min-height:200px}
  .pol{--w:100% !important;width:100%}
}
@media (prefers-reduced-motion:reduce){.desk>*{transition:none}}
</style>
<body>
