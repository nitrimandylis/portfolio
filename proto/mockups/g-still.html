<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mockup g: still with subtitles</title>
<style>
@font-face{font-family:Chillax;src:url(/fonts/Chillax-Variable.woff2) format("woff2");font-weight:200 700}
:root{--bg:#0d1014;--fg:#f1ede4;--mu:rgba(241,237,228,.6);--ac:#e0a35a}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--fg);font:400 19px/1.5 Chillax,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:36px 44px 40px;position:relative;isolation:isolate}
a{color:inherit;text-decoration:none}

/* one of his photos, the whole screen. a different one each visit. */
.still{position:fixed;inset:0;z-index:-1;background:var(--bg)}
.still img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;filter:brightness(.78)}
.still::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(13,16,20,.55),transparent 28%,transparent 55%,rgba(13,16,20,.85))}

.name{display:block;width:170px;height:46px;background:currentColor;-webkit-mask:url(/hand/name.svg) left center/contain no-repeat;mask:url(/hand/name.svg) left center/contain no-repeat;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.top .where{color:var(--mu);font-size:.85em;text-align:right;line-height:1.4;text-shadow:0 1px 2px rgba(0,0,0,.6)}

/* the subtitle band: two lines, centred, where a subtitle sits */
.sub{align-self:end;text-align:center;margin:0 auto;max-width:42rem;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 12px rgba(0,0,0,.5)}
.sub p{margin:0;font-size:1.25em;line-height:1.35}
.sub .doors{display:flex;justify-content:center;gap:1.6em;margin:1.1em 0 0;padding:0;list-style:none;font-size:1.05em;color:var(--mu)}
.sub .doors a:hover{color:var(--fg)}

.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:60px;color:var(--mu);font-size:.85em;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.foot b{font-weight:500;color:var(--fg)}
.foot .r a{margin-left:1.4em}
.foot .r a:hover{color:var(--fg)}
@media (max-width:720px){body{padding:28px 22px 30px}.sub p{font-size:1.05em}.sub br{display:none}.sub .doors{flex-wrap:wrap;gap:.7em 1.2em}.foot{flex-direction:column;align-items:flex-start;gap:.8em}.foot .r a{margin:0 1.4em 0 0}}
</style>
<body>
<div class="still"><img src="/img/photos/siena-after-dark-1600.webp" alt=""></div>

<header class="top">
  <a class="name" href="/" aria-label="nick trim"></a>
  <div class="where">siena, after dark<br>august 2026</div>
</header>

<main class="sub">
  <p>athens, final-year ib. builds tools, ships them,<br>occasionally finishes them.</p>
  <ul class="doors">
    <li><a href="/about/">about</a></li>
    <li><a href="/work/">work</a></li>
    <li><a href="/cv/">cv</a></li>
    <li><a href="/films/">films</a></li>
    <li><a href="/photos/">photos</a></li>
    <li><a href="https://os.nicktrim.com">night shift</a></li>
  </ul>
</main>

<footer class="foot">
  <div>on repeat <b>sweater weather</b>, the neighbourhood. last watched <b>avengers: endgame</b>.</div>
  <div class="r"><a href="mailto:nicktrim8@duck.com">email</a><a href="https://www.linkedin.com/in/nitrimandylis">linkedin</a></div>
</footer>
</body>
</html>
