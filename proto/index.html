<!doctype html><meta charset=utf-8><title>polaroid</title>
<style>
:root{--bg:#17110d;--fg:#efe6d6;--mu:#8f7e6c;--ac:#e0a35a}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:12px ui-monospace,Menlo,monospace;display:flex;gap:70px;align-items:center;justify-content:center}
/* polaroid 600: 88 x 107 mm, image 79 x 79, top 6, sides 4.5 */
.pol{display:block;--rx:0deg;--ry:0deg;--lift:0px;transform:perspective(900px) rotate(var(--r)) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift));transition:transform .5s cubic-bezier(.2,1.4,.4,1);will-change:transform;--w:250px;--gx:30%;--gy:20%;position:relative;width:var(--w);aspect-ratio:88/107;box-sizing:border-box;
  padding:calc(var(--w)*6/88) calc(var(--w)*4.5/88) 0;background:#efe9dc;border-radius:2px;color:#2b2520;text-decoration:none;
  box-shadow:0 1px 1px rgba(0,0,0,.35),0 8px 14px -4px rgba(0,0,0,.45),0 26px 44px -16px rgba(0,0,0,.65)}
/* paper grain */
.pol::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .45  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.img{position:relative;aspect-ratio:1;overflow:hidden;background:#111}
.img img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.04) saturate(.88) sepia(.1)}
/* recess + chemical edge */
.img::before{content:"";position:absolute;inset:0;z-index:1;box-shadow:inset 0 0 0 1px rgba(30,20,10,.55),inset 0 2px 4px rgba(0,0,0,.45),inset 0 0 18px rgba(40,25,10,.35)}
/* gloss: the plastic face catches light */
.img::after{content:"";position:absolute;inset:-20%;z-index:2;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(60% 45% at var(--gx) var(--gy),rgba(255,248,235,.30),transparent 70%),
             linear-gradient(115deg,transparent 38%,rgba(255,255,255,.16) 46%,rgba(255,255,255,.04) 52%,transparent 60%);
  transition:background-position .2s}
.pol:hover{transition:transform .08s linear}
.cap{display:block;height:calc(var(--w)*22/88);display:flex;align-items:center;padding-left:4px;font-size:12px;letter-spacing:.02em}
.l{color:var(--mu);text-align:center;margin-top:18px}
</style>
<div><a class=pol href=# style="--r:-4deg"><div class=img><img src=rome.jpg alt=""></div><span class=cap>about</span></a><div class=l>hover me</div></div>
<div><a class=pol href=# style="--r:3deg"><div class=img><img src=rome.jpg alt=""></div><span class=cap>films</span></a><div class=l>and me</div></div>
<script>
// tilt toward the cursor like a held card, sheen follows; both off for reduced motion
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
for(const p of document.querySelectorAll('.pol')){
  if(still)break;
  p.addEventListener('pointermove',e=>{
    const r=p.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    p.style.setProperty('--ry',(x-.5)*16+'deg');   // max 8deg each way
    p.style.setProperty('--rx',(.5-y)*16+'deg');
    p.style.setProperty('--lift','-6px');
    p.style.setProperty('--gx',x*100+'%');p.style.setProperty('--gy',y*100+'%');
  });
  p.addEventListener('pointerleave',()=>{for(const k of['--rx','--ry'])p.style.setProperty(k,'0deg');p.style.setProperty('--lift','0px')});
}
</script>
